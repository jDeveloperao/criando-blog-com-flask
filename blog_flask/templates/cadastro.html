<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Georgia, "Times New Roman", serif;
        }

        body {
            background: #ffffff;
            color: #1a1a1a;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .box {
            width: 100%;
            max-width: 400px;
            padding: 24px;
        }

        h1 {
            font-size: 26px;
            text-align: center;
            margin-bottom: 18px;
        }

        .flash {
            background: #f5f5f5;
            border-left: 3px solid #111;
            padding: 10px 12px;
            font-size: 13px;
            margin-bottom: 15px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 12px;
            color: #666;
        }

        input {
            padding: 12px 14px;
            border: 1px solid #e5e5e5;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #111;
        }

        button {
            margin-top: 10px;
            background: #111;
            color: #fff;
            border: none;
            padding: 12px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #333;
        }

        .footer {
            margin-top: 16px;
            font-size: 13px;
            text-align: center;
            color: #666;
        }

        
        .footer a {
            color: #111;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Criar Usuário</h1>

    {% for message in get_flashed_messages() %}
        <div class="flash">{{ message }}</div>
    {% endfor %}

    <form method="post">

        <div class="field">
            <label>Nome</label>
            <input type="text" name="nome" required>
        </div>

        <div class="field">
            <label>Email</label>
            <input type="email" name="email" required>
        </div>

        <div class="field">
            <label>Senha</label>
            <input type="password" name="senha" required>
        </div>

        <button type="submit">Cadastrar</button>

    </form>

       <div class="footer">
        Ja tens conta? <a href="{{url_for('auth.login')}}">Entrar</a>
    </div>


</div>


<script>

</script>

</body>
</html>
