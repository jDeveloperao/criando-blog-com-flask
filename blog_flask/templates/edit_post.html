<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Post</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Georgia, "Times New Roman", serif;
        }

        body {
            background: #ffffff;
            color: #1a1a1a;
            line-height: 1.6;
        }

        .container {
            max-width: 720px;
            margin: 60px auto;
            padding: 0 20px;
        }

        /* FLASH */
        .flash {
            background: #f5f5f5;
            border-left: 3px solid #111;
            padding: 10px 12px;
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* TITLE */
        h1 {
            font-size: 28px;
            margin-bottom: 25px;
        }

        /* FORM */
        form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        label {
            font-size: 13px;
            color: #666;
        }

        input, textarea {
            width: 100%;
            border: 1px solid #e5e5e5;
            padding: 12px 14px;
            font-size: 16px;
            font-family: inherit;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: #111;
        }

        textarea {
            min-height: 220px;
            resize: vertical;
        }

        /* BUTTON */
        button {
            background: #111;
            color: #fff;
            border: none;
            padding: 12px 16px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #333;
        }

        /* LABEL STYLE */
        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* BACK */
        .back {
            display: inline-block;
            margin-bottom: 20px;
            font-size: 14px;
            color: #555;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container">

    <a class="back" href="{{ url_for('user.dashboard') }}">← Voltar ao dashboard</a>

    <h1>Criar novo post</h1>

    {% for message in get_flashed_messages() %}
        <div class="flash">{{ message }}</div>
    {% endfor %}

    <form method="post">

        <div class="field">
            <label>Título</label>
            <input type="text" value="{{post.titulo}}" name="titulo" placeholder="Escreve um título..." required>
        </div>

        <div class="field">
            <label>Conteúdo</label>
            <textarea name="conteudo"  aria-valuetext="{{post.conteudo}}" placeholder="Escreve o teu artigo..." required></textarea>
        </div>

        <button type="submit">Publicar</button>

    </form>

</div>

</body>
</html>
