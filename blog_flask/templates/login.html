<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Georgia, "Times New Roman", serif;
        }

        body {
            background: #ffffff;
            color: #1a1a1a;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* CONTAINER */
        .box {
            width: 100%;
            max-width: 380px;
            padding: 24px;
        }

        /* BRAND */
        .brand {
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 26px;
            text-align: center;
            margin-bottom: 18px;
        }

        /* FLASH */
        .flash {
            background: #f5f5f5;
            border-left: 3px solid #111;
            padding: 10px 12px;
            font-size: 13px;
            margin-bottom: 15px;
        }

        /* FORM */
        form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        label {
            font-size: 12px;
            color: #666;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        input {
            padding: 12px 14px;
            border: 1px solid #e5e5e5;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #111;
        }

        /* PASSWORD WRAPPER */
        .password-wrap {
            position: relative;
        }

        .toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            cursor: pointer;
            color: #666;
        }

        /* BUTTON */
        button {
            margin-top: 10px;
            background: #111;
            color: #fff;
            border: none;
            padding: 12px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }

        button:hover {
            background: #333;
        }

        button.loading {
            opacity: 0.7;
            pointer-events: none;
        }

        /* FOOTER */
        .footer {
            margin-top: 16px;
            font-size: 13px;
            text-align: center;
            color: #666;
        }

        .footer a {
            color: #111;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="box">

  

    <h1>Entrar</h1>

    {% for message in get_flashed_messages() %}
        <div class="flash">{{ message }}</div>
    {% endfor %}

    <form method="post" id="loginForm">

        <div class="field">
            <label>Usuário</label>
            <input type="email" name="email" required>
        </div>

        <div class="field">
            <label>Password</label>

            <div class="password-wrap">
                <input type="password" name="senha" id="password" required>
                <span class="toggle" onclick="togglePassword()">mostrar</span>
            </div>
        </div>

        <button type="submit" id="btn">Entrar</button>

    </form>

    <div class="footer">
        Não tens conta? <a href="{{url_for('auth.cadastro')}}">Criar conta</a>
    </div>

</div>

<script>
    function togglePassword() {
        const input = document.getElementById("password");
        const toggle = document.querySelector(".toggle");

        if (input.type === "password") {
            input.type = "text";
            toggle.innerText = "ocultar";
        } else {
            input.type = "password";
            toggle.innerText = "mostrar";
        }
    }

    document.getElementById("loginForm").addEventListener("submit", function () {
        const btn = document.getElementById("btn");
        btn.classList.add("loading");
        btn.innerText = "Entrando...";
    });
</script>

</body>
</html>
