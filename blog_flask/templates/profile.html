<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Georgia, "Times New Roman", serif;
        }

        body {
            background: #ffffff;
            color: #1a1a1a;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 30px 20px;
        }

        /* HEADER PERFIL */
        .profile-header {
            border-bottom: 1px solid #eee;
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .name {
            font-size: 26px;
            font-weight: 700;
        }

        .bio {
            font-size: 14px;
            color: #666;
            margin-top: 6px;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            font-size: 13px;
            color: #444;
        }

        .stat {
            padding: 6px 10px;
            border: 1px solid #eee;
            border-radius: 6px;
        }

        /* POSTS */
        .section-title {
            font-size: 18px;
            margin: 25px 0 15px;
        }

        .post {
            border: 1px solid #eee;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 12px;
            transition: 0.2s;
        }

        .post:hover {
            transform: translateY(-2px);
        }

        .post-title {
            font-size: 18px;
            font-weight: 700;
        }

        .post-meta {
            font-size: 12px;
            color: #777;
            margin-top: 4px;
        }

        .status {
            margin-top: 8px;
            font-size: 13px;
        }

        .published {
            color: green;
        }

        .draft {
            color: red;
        }

    </style>
</head>

<body>

<div class="container">

    <!-- PERFIL -->
    <div class="profile-header">

        <div class="name">
            Nome do Usuário
        </div>

        <div class="bio">
            Bio do usuário aparece aqui. Algo simples e direto.
        </div>

        <div class="stats">
            <div class="stat">Posts: 12</div>
            <div class="stat">Publicados: 8</div>
            <div class="stat">Rascunhos: 4</div>
        </div>

    </div>

    <!-- POSTS -->
    <div class="section-title">Posts do usuário</div>

    <div class="post">
        <div class="post-title">Título do Post 1</div>
        <div class="post-meta">Criado em 20/05/2026</div>
        <div class="status published">Publicado</div>
    </div>

    <div class="post">
        <div class="post-title">Título do Post 2</div>
        <div class="post-meta">Criado em 18/05/2026</div>
        <div class="status draft">Rascunho</div>
    </div>

</div>

</body>
</html>
